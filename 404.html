<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Pointhill</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='36' font-weight='600' fill='%238b7355'%3EP%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f0eb;
      color: #3a3a3a;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .content { max-width: 480px; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 8rem; font-weight: 300;
      color: #d9d2c9; line-height: 1;
      margin-bottom: 1rem;
    }
    h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem; font-weight: 400;
      color: #1a1a1a; margin-bottom: 1rem;
    }
    p { color: #7a7a7a; font-size: .95rem; font-weight: 300; margin-bottom: 2rem; line-height: 1.7; }
    a {
      display: inline-block; padding: .85rem 2.5rem;
      font-size: .78rem; font-weight: 600; letter-spacing: .16em;
      text-transform: uppercase; text-decoration: none;
      border: 1.5px solid #8b7355; color: #8b7355;
      transition: background .3s, color .3s;
    }
    a:hover { background: #8b7355; color: #fff; }
  </style>
</head>
<body>
  <div class="content">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to somewhere beautiful.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
